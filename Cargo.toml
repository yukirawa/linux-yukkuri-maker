[package]
name = "linux-yukkuri-maker"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
fltk = { version = "1.4", features = ["fltk-bundled"] }

# GStreamer による動画再生・編集エンジン
gstreamer = "0.23"
gstreamer-video = "0.23"
gstreamer-app = "0.23"
glib = "0.20"

# ボイス処理 AquesTalk 
aquestalk = "0.1"           # AquesTalkラッパー
reqwest = { version = "0.12", optional = true }  # VOICEVOX HTTP API用
tokio = { version = "1.0", features = ["full"], optional = true }  # 非同期処理

# プロジェクト保存（JSONシリアライズ）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# エラーハンドリング
anyhow = "1.0"
thiserror = "1.0"

# ユーティリティ
chrono = "0.4"               # 時間管理
