[package]
name = "linux-yukkuri-maker"
version = "0.1.0"
edition = "2024"

[dependencies]
# GUI
fltk = "1.4"

# ボイス処理 AquesTalk 
aquestalk = "0.1"           # AquesTalkラッパー
reqwest = { version = "0.12", optional = true }  # VOICEVOX HTTP API用
tokio = { version = "1.0", features = ["full"], optional = true }  # 非同期処理

# 映像処理 FFmpeg
ffmpeg-next = "8.0"

# プロジェクト保存（JSONシリアライズ）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# エラーハンドリング
anyhow = "1.0"
thiserror = "1.0"

# ユーティリティ
chrono = "0.4"               # 時間管理